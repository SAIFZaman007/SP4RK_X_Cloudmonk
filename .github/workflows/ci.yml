name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      # The CSP hash is generated at build time. If the JSON-LD block changed
      # but dist/_headers still contains the placeholder, the deployed site
      # would silently drop its script-src allowance.
      - name: Assert CSP hash was substituted
        run: |
          if grep -q "__INLINE_SCRIPT_HASHES__" dist/_headers; then
            echo "::error::CSP placeholder not substituted - scripts/csp-hash.mjs did not run"
            exit 1
          fi
          echo "CSP hash substituted OK"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
